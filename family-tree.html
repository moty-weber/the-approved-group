<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Tree Assessment | Approved Group</title>
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f4f7f9; margin: 0; display: flex; justify-content: center; padding: 40px 20px; }
        .main-wrapper { max-width: 1100px; display: flex; gap: 30px; flex-wrap: wrap; }
        .tree-box { flex: 2; background: white; padding: 40px; border-radius: 25px; box-shadow: 0 15px 40px rgba(0,0,0,0.1); text-align: center; }
        .info-panel { flex: 1; background: #050c1a; color: white; padding: 30px; border-radius: 25px; min-width: 280px; }
        .node { border: 2px solid #d4af37; padding: 12px; border-radius: 12px; margin: 8px; display: inline-block; width: 210px; background: #fff; }
        .node label { display: block; font-size: 0.65rem; font-weight: bold; color: #050c1a; text-transform: uppercase; margin-bottom: 4px; }
        .node input { border: none; width: 100%; text-align: center; outline: none; font-size: 0.9rem; }
        .connector { width: 2px; height: 20px; background: #d4af37; margin: 0 auto; }
        .submit-btn { background: #d4af37; color: #050c1a; padding: 20px; width: 100%; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 30px; font-size: 1.1rem; }
        .email-field { margin-top: 20px; border-top: 1px solid #eee; padding-top: 20px; }
        .email-field input { width: 80%; padding: 10px; border: 1px solid #d4af37; border-radius: 8px; text-align: center; }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <div class="tree-box">
            <h1 style="font-family: serif; font-size: 2.2rem; margin: 0 0 30px 0;">4-Generation Lineage Tree</h1>
            <form action="https://formspree.io/f/xdayrong" method="POST">
                
                <input type="hidden" name="_subject" value="NEW FAMILY TREE SUBMISSION">

                <div>
                    <div class="node"><label>Great-GF (EU Side)</label><input type="text" name="GGF" placeholder="Name & Birth Country"></div>
                    <div class="node"><label>Great-GM (EU Side)</label><input type="text" name="GGM" placeholder="Name & Birth Country"></div>
                </div>
                <div class="connector"></div>
                <div>
                    <div class="node"><label>Grandfather (EU Line)</label><input type="text" name="GF" placeholder="Name & Birth Country"></div>
                    <div class="node"><label>Grandmother (EU Line)</label><input type="text" name="GM" placeholder="Name & Birth Country"></div>
                </div>
                <div class="connector"></div>
                <div><div class="node"><label>Father / Mother (EU Line)</label><input type="text" name="Parent" placeholder="Full Name"></div></div>
                <div class="connector"></div>
                <div><div class="node" style="border-width: 4px;"><label>Applicant (You)</label><input type="text" name="Applicant" placeholder="Your Full Name" required></div></div>
                
                <div class="email-field">
                    <label style="display:block; font-size:0.8rem; font-weight:bold; margin-bottom:5px;">YOUR EMAIL ADDRESS</label>
                    <input type="email" name="email" placeholder="email@example.com" required>
                </div>

                <button type="submit" class="submit-btn">SUBMIT LINEAGE FOR REVIEW</button>
            </form>
        </div>
        <div class="info-panel">
            <h3 style="color: #d4af37;">Why 4 Generations?</h3>
            <p style="font-size: 0.9rem; line-height: 1.6;">To confirm EU eligibility, we must document your lineage generation by generation. By identifying each ancestor, we can build a strong legal case for your citizenship.</p>
            <br><a href="index.html" style="color: #d4af37; text-decoration: none;">← Back to Home</a>
        </div>
    </div>
</body>
</html>
