<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ancestry Map | The Approved Group</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>(function(){ emailjs.init("Vyn1uEt_qyYpqR5Ux"); })();</script>

    <style>
        :root { --navy: #050c1a; --gold: #d4af37; --light-gold: #fffdf5; --white: #ffffff; }
        body { font-family: 'Poppins', sans-serif; background: #f0f2f5; margin: 0; color: var(--navy); overflow-x: hidden; }
        
        .header { padding: 40px 20px; text-align: center; background: var(--navy); color: var(--gold); border-bottom: 3px solid var(--gold); }
        .top-actions { display: flex; gap: 15px; justify-content: center; margin-top: 20px; }
        .action-btn { background: var(--gold); color: var(--navy); padding: 12px 25px; border-radius: 50px; font-weight: 700; border: none; cursor: pointer; text-transform: uppercase; font-size: 0.8rem; text-decoration: none; }

        /* Tree Container - נוצט א ספעציעלן ID פארן בילד */
        #capture-area { 
            padding: 50px; 
            background: #f0f2f5; 
            display: flex; 
            flex-direction: column-reverse; 
            align-items: center; 
            gap: 60px; 
            min-width: 1200px; /* מאכט זיכער אז די בילד ווערט נישט קליין */
        }

        .tree-wrapper { overflow-x: auto; padding-bottom: 300px; }

        .level { display: flex; justify-content: center; width: 100%; position: relative; gap: 20px; }
        .node-group { display: flex; gap: 10px; }
        
        .node { 
            background: white; border: 1px solid #ddd; padding: 15px; width: 160px; 
            border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-bottom: 4px solid #ccc;
        }
        .node.eu-side { border-color: var(--gold); background: var(--light-gold); border-bottom: 4px solid var(--gold); }
        .node-label { font-size: 9px; font-weight: 800; color: var(--gold); text-transform: uppercase; margin-bottom: 8px; display: block; }
        
        .node input { width: 100%; border: none; border-bottom: 1px solid #eee; margin-bottom: 5px; font-size: 11px; outline: none; background: transparent; }

        .submit-section { text-align: center; margin-top: 50px; padding-bottom: 100px; }
        .submit-btn { background: var(--navy); color: var(--gold); padding: 20px 80px; border-radius: 50px; font-size: 1.2rem; font-weight: 700; border: 2px solid var(--gold); cursor: pointer; }
    </style>
</head>
<body>

<div class="header">
    <h1 style="font-family: 'Playfair Display'; margin:0;">Ancestry Structure</h1>
    <div class="top-actions">
        <a href="./family-tree-template.jpg" download class="action-btn" style="background:transparent; color:white; border:1px solid white;">Download Blank JPG</a>
        <button class="action-btn" onclick="downloadFullTree()">Download My Version (Full)</button>
    </div>
</div>

<div class="tree-wrapper">
    <form id="family-tree-form">
        <div id="capture-area">
            <div class="level">
                <div class="node eu-side">
                    <span class="node-label">Applicant</span>
                    <input type="text" name="L1_name" placeholder="Name"><input type="text" name="L1_dob" placeholder="DOB"><input type="text" name="L1_pob" placeholder="POB"><input type="text" name="L1_dom" placeholder="DOM">
                </div>
            </div>

            <div class="level">
                <div class="node-group">
                    <div class="node eu-side"><span class="node-label">Parent (EU)</span><input type="text" name="L2_1_name" placeholder="Name"><input type="text" name="L2_1_dob" placeholder="DOB"><input type="text" name="L2_1_pob" placeholder="POB"><input type="text" name="L2_1_dom" placeholder="DOM"></div>
                    <div class="node"><span class="node-label">Spouse</span><input type="text" name="L2_2_name" placeholder="Name"><input type="text" name="L2_2_dob" placeholder="DOB"><input type="text" name="L2_2_pob" placeholder="POB"><input type="text" name="L2_2_dom" placeholder="DOM"></div>
                </div>
            </div>

            <div class="level">
                <div class="node-group">
                    <div class="node eu-side"><span class="node-label">EU GP</span><input type="text" name="L3_1_name" placeholder="Name"><input type="text" name="L3_1_dob" placeholder="DOB"><input type="text" name="L3_1_pob" placeholder="POB"><input type="text" name="L3_1_dom" placeholder="DOM"></div>
                    <div class="node"><span class="node-label">Spouse</span><input type="text" name="L3_2_name" placeholder="Name"><input type="text" name="L3_2_dob" placeholder="DOB"><input type="text" name="L3_2_pob" placeholder="POB"><input type="text" name="L3_2_dom" placeholder="DOM"></div>
                </div>
                <div class="node-group">
                    <div class="node eu-side"><span class="node-label">EU GP</span><input type="text" name="L3_3_name" placeholder="Name"><input type="text" name="L3_3_dob" placeholder="DOB"><input type="text" name="L3_3_pob" placeholder="POB"><input type="text" name="L3_3_dom" placeholder="DOM"></div>
                    <div class="node"><span class="node-label">Spouse</span><input type="text" name="L3_4_name" placeholder="Name"><input type="text" name="L3_4_dob" placeholder="DOB"><input type="text" name="L3_4_pob" placeholder="POB"><input type="text" name="L3_4_dom" placeholder="DOM"></div>
                </div>
            </div>

            <div class="level">
                <div class="node-group"><div class="node eu-side"><span class="node-label">EU GGP</span><input type="text" name="L4_1_name" placeholder="Name"><input type="text" name="L4_1_dob" placeholder="DOB"><input type="text" name="L4_1_pob" placeholder="POB"><input type="text" name="L4_1_dom" placeholder="DOM"></div><div class="node"><span class="node-label">Spouse</span><input type="text" name="L4_2_name" placeholder="Name"><input type="text" name="L4_2_dob" placeholder="DOB"><input type="text" name="L4_2_pob" placeholder="POB"><input type="text" name="L4_2_dom" placeholder="DOM"></div></div>
                <div class="node-group"><div class="node eu-side"><span class="node-label">EU GGP</span><input type="text" name="L4_3_name" placeholder="Name"><input type="text" name="L4_3_dob" placeholder="DOB"><input type="text" name="L4_3_pob" placeholder="POB"><input type="text" name="L4_3_dom" placeholder="DOM"></div><div class="node"><span class="node-label">Spouse</span><input type="text" name="L4_4_name" placeholder="Name"><input type="text" name="L4_4_dob" placeholder="DOB"><input type="text" name="L4_4_pob" placeholder="POB"><input type="text" name="L4_4_dom" placeholder="DOM"></div></div>
                <div class="node-group"><div class="node eu-side"><span class="node-label">EU GGP</span><input type="text" name="L4_5_name" placeholder="Name"><input type="text" name="L4_5_dob" placeholder="DOB"><input type="text" name="L4_5_pob" placeholder="POB"><input type="text" name="L4_5_dom" placeholder="DOM"></div><div class="node"><span class="node-label">Spouse</span><input type="text" name="L4_6_name" placeholder="Name"><input type="text" name="L4_6_dob" placeholder="DOB"><input type="text" name="L4_6_pob" placeholder="POB"><input type="text" name="L4_6_dom" placeholder="DOM"></div></div>
                <div class="node-group"><div class="node eu-side"><span class="node-label">EU GGP</span><input type="text" name="L4_7_name" placeholder="Name"><input type="text" name="L4_7_dob" placeholder="DOB"><input type="text" name="L4_7_pob" placeholder="POB"><input type="text" name="L4_7_dom" placeholder="DOM"></div><div class="node"><span class="node-label">Spouse</span><input type="text" name="L4_8_name" placeholder="Name"><input type="text" name="L4_8_dob" placeholder="DOB"><input type="text" name="L4_8_pob" placeholder="POB"><input type="text" name="L4_8_dom" placeholder="DOM"></div></div>
            </div>
        </div>

        <div class="submit-section">
            <button type="button" class="submit-btn" onclick="sendToLegal()">Submit to Legal Team</button>
        </div>
    </form>
</div>

<script>
    function downloadFullTree() {
        const area = document.getElementById('capture-area');
        
        // דאס זאגט פארן קאמפיוטער צו כאפן דעם גאנצן שטח, נישט נאר די ווינדאוי
        html2canvas(area, {
            scrollX: 0,
            scrollY: -window.scrollY,
            windowWidth: area.scrollWidth,
            windowHeight: area.scrollHeight,
            scale: 2, // מאכט די בילד שארף
            useCORS: true,
            backgroundColor: "#f0f2f5"
        }).then(canvas => {
            const link = document.createElement('a');
            link.download = 'Complete-Family-Tree.png';
            link.href = canvas.toDataURL("image/png");
            link.click();
        });
    }

    function sendToLegal() {
        const btn = document.querySelector('.submit-btn');
        btn.innerText = "Sending...";
        emailjs.sendForm("service_tls7kck", "template_1hsm36j", "#family-tree-form")
            .then(() => {
                alert("Sent!");
                btn.innerText = "Sent Successfully";
            }, (err) => {
                alert("Error. Try again.");
                btn.innerText = "Submit to Legal Team";
            });
    }
</script>
</body>
</html>
