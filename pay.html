<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Payment | The Approved Group</title>
    <meta name="description" content="Secure and confidential payment portal for The Approved Group consultancy services.">
 
    <link rel="icon" type="image/png" sizes="96x96" href="https://approvedeu.com/preview.png">
    <link rel="shortcut icon" href="https://approvedeu.com/preview.png">
    <link rel="apple-touch-icon" href="https://approvedeu.com/preview.png">
    <meta name="thumbnail" content="https://approvedeu.com/preview.png">
    <meta property="og:image" content="https://approvedeu.com/preview.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root { 
            --primary-blue: #050c1a; 
            --navy-shiny: #0a192f; 
            --accent-gold: #d4af37; 
            --darker-gold: #b8860b; 
            --white: #ffffff; 
            --soft-bg: #fdfdfd; 
        }

        body { font-family: 'Poppins', sans-serif; margin: 0; background: var(--soft-bg); overflow-x: hidden; }
        
        header { 
            background: var(--navy-shiny); padding: 20px 0; text-align: center; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); border-bottom: 2px solid var(--accent-gold); 
            position: fixed; width: 100%; top: 0; z-index: 1000;
        }
        .logo img { width: 180px; filter: brightness(1.1); }
        
        .back-btn-container { position: fixed; top: 20px; left: 25px; z-index: 1100; }
        .luxury-btn {
            background-color: var(--accent-gold); color: var(--primary-blue);
            padding: 10px 22px; text-decoration: none; font-weight: bold;
            font-size: 0.8rem; border-radius: 50px; box-shadow: 0px 4px 15px rgba(0,0,0,0.4);
            display: flex; align-items: center; gap: 8px; border: 2px solid var(--accent-gold);
            cursor: pointer; text-transform: uppercase; transition: 0.3s;
        }
        .luxury-btn:hover { background: transparent; color: var(--accent-gold); }

        .payment-section { padding: 180px 5% 100px; display: flex; justify-content: center; }
        .payment-container { 
            max-width: 550px; width: 100%; background: var(--white); 
            padding: 50px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.1); 
            border-top: 4px solid var(--primary-blue); text-align: center;
        }
        
        h2 { font-family: 'Playfair Display', serif; color: var(--primary-blue); font-size: 2.2rem; margin-bottom: 15px; }
        .subtitle { color: #666; font-size: 0.95rem; margin-bottom: 40px; }

        .payment-method-box {
            border: 2px solid #f0f0f0; border-radius: 15px; padding: 30px; margin-bottom: 30px;
            transition: 0.3s; background: #fafafa; display: flex; flex-direction: column; align-items: center; gap: 15px;
        }
        .payment-method-box:hover { border-color: var(--accent-gold); background: var(--white); }
        .wise-logo { font-size: 2.5rem; font-weight: 800; color: #00b67a; font-style: italic; letter-spacing: -2px; }

        .pay-now-btn { 
            background: var(--primary-blue); color: var(--accent-gold); padding: 15px 40px; 
            border-radius: 50px; text-decoration: none; font-weight: 700; font-size: 1rem; 
            box-shadow: 0 5px 15px rgba(5,12,26,0.3); transition: 0.3s; border: 2px solid var(--accent-gold); 
            display: inline-flex; align-items: center; gap: 10px; text-transform: uppercase;
        }
        .pay-now-btn:hover { background: var(--accent-gold); color: var(--primary-blue); }

        .notice-box {
            background: #fff9e6; border: 1px solid #ffeeba; color: #856404;
            padding: 15px; border-radius: 12px; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 20px;
        }

        footer { background: var(--primary-blue); color: var(--white); padding: 40px 20px; text-align: center; font-size: 0.85rem; margin-top: 60px; }
    </style>
</head>
<body>

<div class="back-btn-container">
    <a href="index.html" class="luxury-btn"><i class="fas fa-arrow-left"></i> BACK TO HOME</a>
</div>

<header>
    <div class="logo"><img src="logo.png" alt="The Approved Group"></div>
</header>

<section class="payment-section">
    <div class="payment-container">
        <h2>Secure Payment Portal</h2>
        <p class="subtitle">Please proceed with Wise to complete your transaction securely.</p>
        
        <!-- Current Active Payment Method -->
        <div class="payment-method-box">
            <div class="wise-logo"><i class="fas fa-flag-usa"></i> wise</div>
            <p style="font-size: 0.9rem; color: #555; margin: 0 0 10px 0;">Fast, secure, and international bank transfers or card payments via Wise.</p>
            <a href="https://wise.com/home" target="_blank" class="pay-now-btn">
                Proceed to Pay <i class="fas fa-external-link-alt"></i>
            </a>
        </div>

        <!-- Future Payment Methods Notice -->
        <div class="notice-box">
            <i class="fas fa-info-circle"></i>
            <span>Additional payment methods will be available soon.</span>
        </div>
    </div>
</section>

<footer>&copy; 2026 THE APPROVED GROUP. ALL RIGHTS RESERVED.</footer>

</body>
</html>
