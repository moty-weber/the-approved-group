    <style>
        :root { 
            --primary-blue: #050c1a; 
            --navy-shiny: #0a192f; 
            --accent-gold: #d4af37; 
            --darker-gold: #b8860b; 
            --white: #ffffff; 
            --soft-bg: #fdfdfd; 
            --error-red: #ff0000;
        }

        body { font-family: 'Poppins', sans-serif; margin: 0; background: var(--soft-bg); overflow-x: hidden; scroll-behavior: smooth; }
        
        header { 
            background: var(--navy-shiny); padding: 25px 0; text-align: center; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); border-bottom: 2px solid var(--accent-gold); 
            position: fixed; width: 100%; top: 0; z-index: 1000; transition: 0.4s;
        }
        header.scrolled { padding: 10px 0; background: rgba(5, 12, 26, 0.95); backdrop-filter: blur(10px); }
        .logo img { width: 250px; transition: 0.4s; filter: brightness(1.1); }
        header.scrolled .logo img { width: 160px; }
        .header-slogan { color: var(--darker-gold); font-size: 0.85rem; font-weight: 600; letter-spacing: 4px; text-transform: uppercase; margin-top: 8px; transition: 0.4s; }
        header.scrolled .header-slogan { font-size: 0; opacity: 0; }
        .top-btn-container { position: fixed; top: 25px; z-index: 1100; display: flex; gap: 12px; transition: 0.4s; }
        .left-side { left: 25px; } .right-side { right: 25px; }
        header.scrolled ~ .top-btn-container { top: 15px; }
        .luxury-btn {
            background-color: var(--accent-gold); color: var(--primary-blue);
            padding: 10px 22px; text-decoration: none; font-weight: bold;
            font-size: 0.8rem; border-radius: 50px; box-shadow: 0px 4px 15px rgba(0,0,0,0.4);
            display: flex; align-items: center; gap: 8px; border: 2px solid var(--accent-gold);
            cursor: pointer; text-transform: uppercase; transition: 0.3s;
        }
        .verify-widget {
            background: var(--white); border: 2px solid var(--accent-gold); padding: 5px 15px;
            border-radius: 50px; display: flex; align-items: center; gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: 0.3s;
        }
        .verify-widget.error-active { border-color: var(--error-red); box-shadow: 0 0 15px rgba(255, 0, 0, 0.5); }
        .verify-widget input { border: none; outline: none; font-size: 0.8rem; width: 160px; font-family: inherit; }
        .verified-status {
            color: var(--accent-gold); font-weight: bold; background: var(--primary-blue);
            padding: 8px 20px; border-radius: 50px; font-size: 0.85rem; border: 1px solid var(--accent-gold);
        }
        .hero { position: relative; height: 45vh; margin-top: 135px; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #000; }
        .hero video { position: absolute; top: 50%; left: 50%; min-width: 100%; min-height: 100%; transform: translate(-50%, -50%); object-fit: cover; z-index: 1; opacity: 0.75; }
        .action-bar { display: flex; justify-content: center; gap: 15px; margin-top: -35px; position: relative; z-index: 100; padding: 0 10px; flex-wrap: wrap; }
        .action-btn { 
            background: var(--accent-gold); color: var(--primary-blue); padding: 14px 28px; 
            border-radius: 50px; text-decoration: none; font-weight: 700; font-size: 0.9rem; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); transition: 0.3s; display: flex; align-items: center; gap: 10px; border: 2px solid var(--accent-gold); 
        }
        .form-section { padding: 100px 5% 150px; background: var(--white); position: relative; z-index: 5; }
        .form-container { max-width: 750px; margin: 0 auto; background: var(--white); padding: 50px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.1); border-top: 4px solid var(--primary-blue); }
        #error-msg-box { 
            display: none; color: var(--error-red); font-weight: bold; margin-bottom: 25px; 
            text-align: center; font-size: 1.2rem; border: 1px solid var(--error-red);
            padding: 10px; border-radius: 10px; background: #fff5f5;
        }
        .field { margin-bottom: 25px; text-align: left; }
        .field label { display: block; font-weight: 600; margin-bottom: 10px; color: var(--primary-blue); font-size: 0.85rem; text-transform: uppercase; }
        .field input, .field select, .field textarea { width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 12px; box-sizing: border-box; font-family: inherit; }

        .submit-btn { background: var(--primary-blue); color: var(--accent-gold); padding: 20px; border-radius: 12px; width: 100%; border: 2px solid var(--accent-gold); font-weight: 700; cursor: pointer; text-transform: uppercase; transition: 0.3s; font-size: 1.1rem; }

<body onload="checkSavedSession()">

<div class="top-btn-container left-side">
    <a href="guide.pdf" download class="luxury-btn"><i class="fas fa-file-download"></i> PDF GUIDE</a>
</div>

<div class="top-btn-container right-side" id="verify-area-container">
    <div class="verify-widget" id="v-step-1">
        <input type="email" id="h_email_field" placeholder="Verify Email First">
        <button class="luxury-btn" style="padding: 5px 15px; font-size: 0.7rem;" onclick="processSendCode()">Verify</button>
    </div>
    <div class="verify-widget" id="v-step-2" style="display:none;">
        <input type="text" id="h_code_field" placeholder="6-Digit Code">
        <button class="luxury-btn" style="padding: 5px 15px; font-size: 0.7rem;" onclick="processConfirmCode()">Confirm</button>
    </div>
    <div id="v-done-badge" class="verified-status" style="display:none;">✓ EMAIL VERIFIED</div>
</div>

<header id="main-header">
    <div class="logo"><img src="logo.png" alt="The Approved Group"></div>
    <div class="header-slogan">Expert EU Citizenship Consultancy</div>
</header>

<section class="hero">
    <video autoplay muted loop playsinline><source src="hero-video.mp4" type="video/mp4"></video>
</section>

<div class="action-bar">
    <a href="about.html" class="action-btn"><i class="fas fa-info-circle"></i> ABOUT</a>
    <a href="family-tree.html" class="action-btn"><i class="fas fa-tree"></i> FAMILY TREE</a>
    <a href="pay.html" class="action-btn"><i class="fas fa-credit-card"></i> PAYMENT</a>
    <a href="contact.html" class="action-btn"><i class="fas fa-address-book"></i> CONTACT</a>
</div>

<section class="form-section">
    <div class="form-container">
        <div id="error-msg-box">Please verify your email first!</div>
        <h2 style="font-family: 'Playfair Display', serif; text-align: center; color: var(--primary-blue); font-size: 2.2rem; margin-bottom: 40px;">Confidential Inquiry</h2>
        <form id="contact-form" action="https://formspree.io/f/xdayrong" method="POST" onsubmit="return handleFormValidation(event)">
            <div class="field"><label>Full Name</label><input type="text" name="name" required></div>
            <div class="field"><label>Email Address (Locked)</label><input type="email" id="form_email_locked" name="email" required readonly placeholder="Verification required at top right"></div>
            <div class="field"><label>Phone Number</label><input type="tel" name="phone" required></div>
            <div class="field">
                <label>Primary Objective</label>
                <select name="objective" required>
                    <option value="" disabled selected>Select Inquiry Type...</option>
                    <option value="citizenship">EU Citizenship by Ancestry</option>
                    <option value="residency">EU Residency / Work Permits</option>
                    <option value="consultation">Legal Consultation</option>
                    <option value="other">Other</option> </select>
            </div>
            <div class="field"><label>Additional Details</label><textarea name="message" rows="4" placeholder="Briefly describe your case..."></textarea></div>
            <button type="submit" class="submit-btn">SUBMIT INQUIRY</button>
        </form>
    </div>
</section>

<script>
    window.addEventListener('scroll', function() {
        const header = document.getElementById('main-header');
        if (window.scrollY > 50) header.classList.add('scrolled');
        else header.classList.remove('scrolled');
    });

    let secretGeneratedCode;
    function checkSavedSession() {
        const savedEmail = localStorage.getItem("user_email");
        if (savedEmail) applyVerification(savedEmail);
    }

    function processSendCode() {
        const email = document.getElementById('h_email_field').value;
        if(!email || !email.includes('@')) { alert("Valid email address required."); return; }
        secretGeneratedCode = Math.floor(100000 + Math.random() * 900000);
        emailjs.send("service_lb6bhaq", "template_4kmjvj7", { to_email: email, code: secretGeneratedCode })
        .then(() => {
            document.getElementById('v-step-1').style.display = 'none';
            document.getElementById('v-step-2').style.display = 'flex';
            alert("Verification code sent to " + email);
        });
    }

    function processConfirmCode() {
        const userInput = document.getElementById('h_code_field').value;
        if(userInput == secretGeneratedCode) {
            applyVerification(document.getElementById('h_email_field').value);
        } else alert("Invalid code.");
    }

    function applyVerification(email) {
        localStorage.setItem("user_email", email);
        document.getElementById('form_email_locked').value = email;
        document.getElementById('v-step-1').style.display = 'none';
        document.getElementById('v-step-2').style.display = 'none';
        document.getElementById('v-done-badge').style.display = 'block';
        document.getElementById('error-msg-box').style.display = 'none';
    }

    function handleFormValidation(e) {
        if (!localStorage.getItem("user_email")) {
            e.preventDefault();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            document.getElementById('error-msg-box').style.display = 'block';
            return false;
        }
        return true;
    }
</script>
</body>
