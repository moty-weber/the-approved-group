<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Google Search & Display Info (דאָס טוישט נאָר די אינדרויסן) -->
    <title>The Approved Group | EU Immigration Experts</title>
    <meta name="description" content="The Approved Group offers professional EU citizenship and residency consultancy. Secure your European future with our expert ancestry and immigration services.">
    
    <!-- Social Media & WhatsApp בילד -->
    <meta property="og:title" content="The Approved Group | EU Immigration Experts">
    <meta property="og:description" content="Expert EU Citizenship Consultancy.">
    <meta property="og:image" content="https://www.approvedeu.com/logo.png">
    <meta property="og:url" content="https://www.approvedeu.com">
    <meta property="og:type" content="website">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary-blue: #050c1a; --navy-shiny: #0a192f; --accent-gold: #d4af37; --white: #ffffff; --soft-bg: #fdfdfd; }
        body { font-family: 'Poppins', sans-serif; margin: 0; background: var(--soft-bg); overflow-x: hidden; }
        
        header { 
            background: var(--navy-shiny); padding: 15px 0 25px; text-align: center; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); border-bottom: 2px solid var(--accent-gold); 
            position: fixed; width: 100%; top: 0; z-index: 1000; will-change: transform, opacity; 
        }
        .logo img { width: 300px; filter: brightness(1.1); margin-bottom: 5px; }
        
        .header-slogan { 
            color: var(--accent-gold); 
            font-size: 0.8rem; 
            letter-spacing: 4px; 
            font-weight: 400; 
            text-transform: uppercase; 
            opacity: 0.9;
        }

        .top-download-container {
            position: fixed;
            top: 25px;
            right: 25px;
            z-index: 1100;
        }

        .top-download-btn {
            background-color: var(--accent-gold);
            color: var(--primary-blue);
            padding: 10px 20px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.85rem;
            border-radius: 50px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.4);
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 2px solid var(--accent-gold);
        }

        .top-download-btn:hover {
            background-color: transparent;
            color: var(--accent-gold);
            transform: scale(1.05);
        }

        .hero { 
            position: relative; height: 60vh; margin-top: 130px; 
            display: flex; align-items: center; justify-content: center; 
            overflow: hidden; background: #000; 
        }
        .hero video { 
            position: absolute; top: 50%; left: 50%; min-width: 100%; min-height: 100%; 
            transform: translate(-50%, -50%); object-fit: cover; opacity: 1; z-index: 1; 
        }

        .action-bar { display: flex; justify-content: center; gap: 15px; margin-top: -35px; position: relative; z-index: 100; padding: 0 10px; flex-wrap: wrap; }
        .action-btn { 
            background: var(--accent-gold); color: var(--primary-blue); padding: 14px 28px; 
            border-radius: 50px; text-decoration: none; font-weight: 700; font-size: 0.9rem; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); transition: 0.3s; 
            display: flex; align-items: center; gap: 10px; border: 2px solid var(--accent-gold); 
        }
        .action-btn:hover { background: var(--primary-blue); color: var(--accent-gold); transform: translateY(-3px); }

        .form-section { padding: 100px 5% 60px; background: var(--white); position: relative; z-index: 5; }
        .form-container { max-width: 750px; margin: 0 auto; background: var(--white); padding: 50px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.1); border-top: 4px solid var(--primary-blue); }
        .field { margin-bottom: 25px; text-align: left; }
        .field label { display: block; font-weight: 600; margin-bottom: 10px; color: var(--primary-blue); font-size: 0.85rem; text-transform: uppercase; }
        .field input, .field select, .field textarea { width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 12px; box-sizing: border-box; font-family: inherit; }
        .submit-btn { background: var(--primary-blue); color: var(--accent-gold); padding: 20px; border-radius: 12px; width: 100%; border: 2px solid var(--accent-gold); font-weight: 700; cursor: pointer; transition: 0.3s; font-size: 1.1rem; text-transform: uppercase; }

        footer { background: var(--primary-blue); color: var(--white); padding: 50px 20px; text-align: center; }
    </style>
</head>
<body>

<div class="top-download-container">
    <a href="guide.pdf" download="Approved_EU_Guide" class="top-download-btn">
        <i class="fas fa-file-download"></i> PDF GUIDE
    </a>
</div>

<header id="main-header">
    <div class="logo"><img src="logo.png" alt="Logo"></div>
    <div class="header-slogan">Expert EU Citizenship Consultancy</div>
</header>

<section class="hero">
    <video autoplay muted loop playsinline><source src="hero-video.mp4" type="video/mp4"></video>
</section>

<div class="action-bar">
    <a href="about.html" class="action-btn"><i class="fas fa-info-circle"></i> ABOUT</a>
    <a href="family-tree.html" class="action-btn"><i class="fas fa-tree"></i> FAMILY TREE</a>
    <a href="pay.html" class="action-btn"><i class="fas fa-credit-card"></i> PAYMENT</a>
    <a href="contact.html" class="action-btn"><i class="fas fa-address-book"></i> CONTACT</a>
</div>

<section class="form-section">
    <div class="form-container">
        <h2 style="font-family: 'Playfair Display', serif; text-align: center; color: var(--primary-blue); font-size: 2.2rem; margin-bottom: 40px;">Confidential Inquiry</h2>
        <form action="https://formspree.io/f/xdayrong" method="POST">
            <div class="field"><label>Full Name</label><input type="text" name="name" required></div>
            <div class="field"><label>Email Address</label><input type="email" name="email" required></div>
            <div class="field"><label>Current Status (Optional)</label><textarea name="status" rows="2" placeholder="Your current status..."></textarea></div>
            <div class="field"><label>Family Heritage Info</label><textarea name="heritage" rows="2" placeholder="Ancestors' birth countries..."></textarea></div>
            <div class="field">
                <label>Primary Objective</label>
                <select name="objective">
                    <option value="citizenship">EU Citizenship by Ancestry</option>
                    <option value="residency">EU Residency / Work Permits</option>
                    <option value="other">OTHER</option>
                </select>
            </div>
            <button type="submit" class="submit-btn">SUBMIT INQUIRY</button>
        </form>
    </div>
</section>

<footer>&copy; 2026 THE APPROVED GROUP. ALL RIGHTS RESERVED.</footer>

<script>
    window.addEventListener('scroll', function() {
        const header = document.getElementById('main-header');
        let scrollPosition = window.pageYOffset;
        header.style.transform = 'translateY(-' + (scrollPosition * 0.6) + 'px)';
        header.style.opacity = 1 - (scrollPosition / 300);
    });
</script>

</body>
</html>
