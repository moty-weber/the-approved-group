<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>The Approved Group | EU Immigration Experts</title>
    <meta name="description" content="Secure your future in Europe with The Approved Group. Premier consultancy for EU citizenship by ancestry and residency applications.">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script>
        (function(){ emailjs.init("Vyn1uEt_qyYpqR5Ux"); })();
    </script>

    <style>
        :root { --primary-blue: #050c1a; --navy-shiny: #0a192f; --accent-gold: #d4af37; --white: #ffffff; --soft-bg: #fdfdfd; }
        body { font-family: 'Poppins', sans-serif; margin: 0; background: var(--soft-bg); overflow-x: hidden; scroll-behavior: smooth; }
        
        /* HEADER LOGIC */
        header { 
            background: var(--navy-shiny); padding: 25px 0; text-align: center; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); border-bottom: 2px solid var(--accent-gold); 
            position: fixed; width: 100%; top: 0; z-index: 1000; transition: all 0.4s ease;
        }
        header.scrolled { padding: 10px 0; background: rgba(5, 12, 26, 0.95); backdrop-filter: blur(10px); }
        .logo img { width: 220px; transition: 0.4s; filter: brightness(1.1); }
        header.scrolled .logo img { width: 160px; }

        /* TOP BUTTONS (PDF & VERIFY) */
        .top-btn-container { position: fixed; top: 25px; z-index: 1100; display: flex; gap: 10px; transition: 0.4s; }
        .left-side { left: 25px; }
        .right-side { right: 25px; }
        header.scrolled ~ .top-btn-container { top: 15px; }

        .luxury-btn {
            background-color: var(--accent-gold); color: var(--primary-blue);
            padding: 10px 20px; text-decoration: none; font-weight: bold;
            font-size: 0.8rem; border-radius: 50px; box-shadow: 0px 4px 15px rgba(0,0,0,0.4);
            display: flex; align-items: center; gap: 8px; border: 2px solid var(--accent-gold);
            cursor: pointer; text-transform: uppercase;
        }

        /* VERIFICATION BOX STYLING */
        .verify-box { background: white; border: 1px solid var(--accent-gold); border-radius: 50px; padding: 5px 15px; display: flex; align-items: center; gap: 8px; box-shadow: 0px 4px 15px rgba(0,0,0,0.2); }
        .verify-box input { border: none; outline: none; font-size: 0.8rem; width: 160px; font-family: inherit; }
        .v-small-btn { background: var(--accent-gold); color: var(--primary-blue); border: none; padding: 5px 12px; border-radius: 50px; font-weight: bold; cursor: pointer; font-size: 0.7rem; }

        /* HERO - FIXED HEIGHT */
        .hero { position: relative; height: 45vh; margin-top: 130px; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #000; }
        .hero video { position: absolute; top: 50%; left: 50%; min-width: 100%; min-height: 100%; transform: translate(-50%, -50%); object-fit: cover; z-index: 1; opacity: 0.8; }

        /* ACTION BAR */
        .action-bar { display: flex; justify-content: center; gap: 15px; margin-top: -35px; position: relative; z-index: 100; padding: 0 10px; flex-wrap: wrap; }
        .action-btn { 
            background: var(--accent-gold); color: var(--primary-blue); padding: 14px 28px; 
            border-radius: 50px; text-decoration: none; font-weight: 700; font-size: 0.9rem; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); transition: 0.3s; 
            display: flex; align-items: center; gap: 10px; border: 2px solid var(--accent-gold); 
        }

        /* FORM SECTION */
        .form-section { padding: 80px 5% 100px; background: var(--white); position: relative; z-index: 5; }
        .form-container { max-width: 750px; margin: 0 auto; background: var(--white); padding: 50px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.1); border-top: 4px solid var(--primary-blue); }
        .field { margin-bottom: 25px; text-align: left; }
        .field label { display: block; font-weight: 600; margin-bottom: 10px; color: var(--primary-blue); font-size: 0.85rem; text-transform: uppercase; }
        .field input, .field select, .field textarea { width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 12px; box-sizing: border-box; font-family: inherit; transition: 0.3s; }
        .field input[readonly] { background: #f4f7f9; cursor: not-allowed; font-weight: bold; color: #555; }
        
        .submit-btn { 
            background: var(--primary-blue); color: var(--accent-gold); padding: 20px; 
            border-radius: 12px; width: 100%; border: 2px solid var(--accent-gold); 
            font-weight: 700; cursor: pointer; transition: 0.3s; font-size: 1.1rem; text-transform: uppercase; 
        }

        footer { background: var(--primary-blue); color: var(--white); padding: 50px 20px; text-align: center; }
    </style>
</head>
<body onload="checkLocalStorage()">

<div class="top-btn-container left-side">
    <a href="guide.pdf" download class="luxury-btn"><i class="fas fa-file-download"></i> PDF GUIDE</a>
</div>

<div class="top-btn-container right-side" id="verify-wrapper">
    <div class="verify-box" id="email-step">
        <input type="email" id="header_email" placeholder="Verify Email First">
        <button class="v-small-btn" onclick="sendVerificationCode()">Verify</button>
    </div>
    <div class="verify-box" id="code-step" style="display:none;">
        <input type="text" id="auth_code" placeholder="Enter Code">
        <button class="v-small-btn" onclick="checkCode()">Confirm</button>
    </div>
    <span id="verified-badge" style="display:none; color: var(--accent-gold); font-weight:bold; background: var(--primary-blue); padding: 8px 20px; border-radius: 50px; border: 1px solid var(--accent-gold);">✓ VERIFIED</span>
</div>

<header id="main-header">
    <div class="logo"><img src="logo.png" alt="The Approved Group"></div>
    <div class="header-slogan">Expert EU Citizenship Consultancy</div>
</header>

<section class="hero">
    <video autoplay muted loop playsinline><source src="hero-video.mp4" type="video/mp4"></video>
</section>

<div class="action-bar">
    <a href="about.html" class="action-btn"><i class="fas fa-info-circle"></i> ABOUT</a>
    <a href="family-tree.html" class="action-btn"><i class="fas fa-tree"></i> FAMILY TREE</a>
    <a href="pay.html" class="action-btn"><i class="fas fa-credit-card"></i> PAYMENT</a>
    <a href="contact.html" class="action-btn"><i class="fas fa-address-book"></i> CONTACT</a>
</div>

<section class="form-section">
    <div class="form-container">
        <h2 style="font-family: 'Playfair Display', serif; text-align: center; color: var(--primary-blue); font-size: 2.2rem; margin-bottom: 40px;">Confidential Inquiry</h2>
        
        <form id="contact-form" action="https://formspree.io/f/xdayrong" method="POST">
            <div class="field">
                <label>Full Name</label>
                <input type="text" name="name" required>
            </div>

            <div class="field">
                <label>Email Address (Verified)</label>
                <input type="email" id="main_user_email" name="email" required readonly placeholder="Verification required at top right">
            </div>

            <div class="field">
                <label>Phone Number</label>
                <input type="tel" name="phone" placeholder="+1 (000) 000-0000" required>
            </div>

            <div class="field">
                <label>Primary Objective</label>
                <select name="objective" required>
                    <option value="" disabled selected>Select Inquiry Type...</option>
                    <option value="citizenship">EU Citizenship by Ancestry</option>
                    <option value="residency">EU Residency / Work Permits</option>
                    <option value="consultation">Legal Consultation</option>
                </select>
            </div>

            <div class="field">
                <label>Additional Details</label>
                <textarea name="message" rows="4" placeholder="Briefly describe your case..."></textarea>
            </div>

            <button type="submit" class="submit-btn" onclick="handleFormSubmit(event)">SUBMIT INQUIRY</button>
        </form>
    </div>
</section>

<footer>&copy; 2026 THE APPROVED GROUP. ALL RIGHTS RESERVED.</footer>

<script>
    // Header Scroll Logic
    window.addEventListener('scroll', function() {
        const header = document.getElementById('main-header');
        if (window.scrollY > 50) header.classList.add('scrolled');
        else header.classList.remove('scrolled');
    });

    let generatedCode;

    // Check if email was verified in this session
    function checkLocalStorage() {
        const savedEmail = localStorage.getItem("user_email");
        if (savedEmail) {
            applyVerification(savedEmail);
        }
    }

    function sendVerificationCode() {
        const email = document.getElementById('header_email').value;
        if(!email || !email.includes('@')) { alert("Please enter a valid email."); return; }
        
        generatedCode = Math.floor(100000 + Math.random() * 900000);
        
        emailjs.send("service_tls7kck", "template_mfhx2ka", {
            to_email: email,
            code: generatedCode
        }).then(() => {
            alert("Code sent to " + email);
            document.getElementById('email-step').style.display = 'none';
            document.getElementById('code-step').style.display = 'flex';
        }, (err) => {
            alert("Error sending email.");
        });
    }

    function checkCode() {
        const inputCode = document.getElementById('auth_code').value;
        if(inputCode == generatedCode) {
            const email = document.getElementById('header_email').value;
            applyVerification(email);
        } else {
            alert("Invalid verification code.");
        }
    }

    function applyVerification(email) {
        localStorage.setItem("user_email", email);
        document.getElementById('main_user_email').value = email;
        document.getElementById('email-step').style.display = 'none';
        document.getElementById('code-step').style.display = 'none';
        document.getElementById('verified-badge').style.display = 'block';
    }

    function handleFormSubmit(e) {
        if (!localStorage.getItem("user_email")) {
            e.preventDefault();
            alert("Email verification is required before submission.");
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }
</script>

</body>
</html>
