<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>The Approved Group | EU Immigration Experts</title>
    <meta name="description" content="Secure your future in Europe with The Approved Group. Premier consultancy for EU citizenship by ancestry and residency applications.">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script>
        (function(){
            emailjs.init("Vyn1uEt_qyYpqR5Ux"); 
        })();
    </script>

    <style>
        :root { --primary-blue: #050c1a; --navy-shiny: #0a192f; --accent-gold: #d4af37; --white: #ffffff; --soft-bg: #fdfdfd; }
        body { font-family: 'Poppins', sans-serif; margin: 0; background: var(--soft-bg); overflow-x: hidden; }
        
        /* SCROLLING HEADER LOGIC */
        header { 
            background: var(--navy-shiny); padding: 25px 0; text-align: center; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); border-bottom: 2px solid var(--accent-gold); 
            position: fixed; width: 100%; top: 0; z-index: 1000; transition: all 0.4s ease;
        }
        header.scrolled { padding: 10px 0; background: rgba(5, 12, 26, 0.95); backdrop-filter: blur(10px); }
        
        .logo img { width: 300px; transition: all 0.4s ease; filter: brightness(1.1); }
        header.scrolled .logo img { width: 180px; }
        
        .header-slogan { color: var(--accent-gold); font-size: 0.8rem; letter-spacing: 4px; text-transform: uppercase; transition: all 0.4s ease; }
        header.scrolled .header-slogan { font-size: 0; opacity: 0; margin: 0; }

        .top-download-container { position: fixed; top: 25px; right: 25px; z-index: 1100; transition: 0.4s; }
        header.scrolled ~ .top-download-container { top: 15px; }

        .top-download-btn {
            background-color: var(--accent-gold); color: var(--primary-blue);
            padding: 10px 20px; text-decoration: none; font-weight: bold;
            font-size: 0.85rem; border-radius: 50px; box-shadow: 0px 4px 15px rgba(0,0,0,0.4);
            display: flex; align-items: center; gap: 8px; border: 2px solid var(--accent-gold);
        }

        .hero { position: relative; height: 65vh; margin-top: 150px; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #000; }
        .hero video { position: absolute; top: 50%; left: 50%; min-width: 100%; min-height: 100%; transform: translate(-50%, -50%); object-fit: cover; z-index: 1; }

        .action-bar { display: flex; justify-content: center; gap: 15px; margin-top: -35px; position: relative; z-index: 100; padding: 0 10px; flex-wrap: wrap; }
        .action-btn { 
            background: var(--accent-gold); color: var(--primary-blue); padding: 14px 28px; 
            border-radius: 50px; text-decoration: none; font-weight: 700; font-size: 0.9rem; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); transition: 0.3s; 
            display: flex; align-items: center; gap: 10px; border: 2px solid var(--accent-gold); 
        }

        .form-section { padding: 100px 5% 60px; background: var(--white); position: relative; z-index: 5; }
        .form-container { max-width: 750px; margin: 0 auto; background: var(--white); padding: 50px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.1); border-top: 4px solid var(--primary-blue); }
        .field { margin-bottom: 25px; text-align: left; }
        .field label { display: block; font-weight: 600; margin-bottom: 10px; color: var(--primary-blue); font-size: 0.85rem; text-transform: uppercase; }
        .field input, .field select, .field textarea { width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 12px; box-sizing: border-box; font-family: inherit; transition: 0.3s; }
        .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent-gold); outline: none; box-shadow: 0 0 10px rgba(212, 175, 55, 0.1); }
        
        .submit-btn { 
            background: var(--primary-blue); color: var(--accent-gold); padding: 20px; 
            border-radius: 12px; width: 100%; border: 2px solid var(--accent-gold); 
            font-weight: 700; cursor: pointer; transition: 0.3s; font-size: 1.1rem; text-transform: uppercase; 
        }

        #verify-btn { background: var(--accent-gold); border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; color: var(--primary-blue); min-width: 100px; }
        
        footer { background: var(--primary-blue); color: var(--white); padding: 50px 20px; text-align: center; }
    </style>
</head>
<body>

<div class="top-download-container">
    <a href="guide.pdf" download class="top-download-btn"><i class="fas fa-file-download"></i> PDF GUIDE</a>
</div>

<header id="main-header">
    <div class="logo"><img src="logo.png" alt="The Approved Group"></div>
    <div class="header-slogan">Expert EU Citizenship Consultancy</div>
</header>

<section class="hero">
    <video autoplay muted loop playsinline><source src="hero-video.mp4" type="video/mp4"></video>
</section>

<div class="action-bar">
    <a href="about.html" class="action-btn"><i class="fas fa-info-circle"></i> ABOUT</a>
    <a href="family-tree.html" class="action-btn"><i class="fas fa-tree"></i> FAMILY TREE</a>
    <a href="pay.html" class="action-btn"><i class="fas fa-credit-card"></i> PAYMENT</a>
    <a href="contact.html" class="action-btn"><i class="fas fa-address-book"></i> CONTACT</a>
</div>

<section class="form-section">
    <div class="form-container">
        <h2 style="font-family: 'Playfair Display', serif; text-align: center; color: var(--primary-blue); font-size: 2.2rem; margin-bottom: 40px;">Confidential Inquiry</h2>
        
        <form id="contact-form" action="https://formspree.io/f/xdayrong" method="POST">
            <div class="field">
                <label>Full Name</label>
                <input type="text" name="name" required>
            </div>

            <div class="field">
                <label>Email Address</label>
                <div style="display: flex; gap: 10px;">
                    <input type="email" id="user_email" name="email" required style="flex: 1;">
                    <button type="button" id="verify-btn" onclick="sendVerificationCode()">Verify</button>
                </div>
            </div>

            <div id="verification-area" class="field" style="display: none; background: #f4f7f9; padding: 15px; border-radius: 10px; margin-top: 10px;">
                <label>Enter 6-Digit Code</label>
                <input type="text" id="auth_code" placeholder="000000" maxlength="6" style="text-align: center; letter-spacing: 5px; font-weight: bold;">
                <button type="button" onclick="checkCode()" style="margin-top: 10px; width: 100%; background: var(--primary-blue); color: var(--accent-gold); border: 1px solid var(--accent-gold); padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold;">CONFIRM CODE</button>
            </div>

            <div class="field">
                <label>Phone Number</label>
                <input type="tel" name="phone" placeholder="+1 (000) 000-0000" required>
            </div>

            <div class="field">
                <label>Primary Objective</label>
                <select name="objective" required>
                    <option value="" disabled selected>Select your inquiry type...</option>
                    <option value="citizenship">EU Citizenship by Ancestry</option>
                    <option value="residency">EU Residency / Work Permits</option>
                    <option value="consultation">Legal Consultation</option>
                    <option value="other">Other Inquiry</option>
                </select>
            </div>

            <div class="field">
                <label>Additional Details</label>
                <textarea name="message" rows="4" placeholder="Briefly describe your case or ancestry..."></textarea>
            </div>

            <button type="submit" id="submit-btn" class="submit-btn" disabled style="opacity: 0.4; cursor: not-allowed;">SUBMIT INQUIRY</button>
            <p id="status-msg" style="text-align: center; font-size: 0.85rem; color: #666; margin-top: 15px;">Email verification required to enable submission.</p>
        </form>
    </div>
</section>

<footer>&copy; 2026 THE APPROVED GROUP. ALL RIGHTS RESERVED.</footer>

<script>
    // Header Scroll Effect Logic
    window.addEventListener('scroll', function() {
        const header = document.getElementById('main-header');
        if (window.scrollY > 50) {
            header.classList.add('scrolled');
        } else {
            header.classList.remove('scrolled');
        }
    });

    let generatedCode;

    function sendVerificationCode() {
        const email = document.getElementById('user_email').value;
        const verifyBtn = document.getElementById('verify-btn');
        if(!email || !email.includes('@')) { alert("Please enter a valid email address."); return; }
        
        generatedCode = Math.floor(100000 + Math.random() * 900000);
        verifyBtn.innerText = "Sending...";
        verifyBtn.disabled = true;

        emailjs.send("service_tls7kck", "template_mfhx2ka", {
            to_email: email,
            code: generatedCode
        }).then(() => {
            alert("Verification code sent to " + email);
            document.getElementById('verification-area').style.display = 'block';
            verifyBtn.innerText = "Sent";
        }, (err) => {
            alert("Error sending email.");
            verifyBtn.innerText = "Verify";
            verifyBtn.disabled = false;
        });
    }

    function checkCode() {
        const inputCode = document.getElementById('auth_code').value;
        const emailField = document.getElementById('user_email');
        const submitBtn = document.getElementById('submit-btn');
        const statusMsg = document.getElementById('status-msg');

        if(inputCode == generatedCode) {
            alert("Identity Verified.");
            
            // --- דא איז די נייע שורה וואס סייווט די אימעיל פארן פאמיליע בוים ---
            localStorage.setItem("user_email", emailField.value);
            // -----------------------------------------------------------------

            emailField.readOnly = true;
            emailField.style.background = "#e9ecef";
            submitBtn.disabled = false;
            submitBtn.style.opacity = "1";
            submitBtn.style.cursor = "pointer";
            statusMsg.innerText = "✓ Identity Verified & Locked.";
            statusMsg.style.color = "#28a745";
            document.getElementById('verification-area').style.display = 'none';
            document.getElementById('verify-btn').style.display = 'none';
        } else {
            alert("Invalid code.");
        }
    }
</script>

</body>
</html>
