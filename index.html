<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Approved EU</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: black;
            font-family: Arial, sans-serif;
        }

        /* קאנטעינער פארן דאונלאוד קנעפל */
        .download-container {
            position: absolute;
            top: 25px;
            right: 25px;
            z-index: 1000; /* מאכט זיכער עס ליגט העכער אלעס */
        }

        /* סטיל פארן דאונלאוד קנעפל */
        .download-btn {
            background-color: #D4AF37; /* גאלד */
            color: black;
            padding: 12px 24px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            border-radius: 30px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
            display: inline-block;
            border: 2px solid transparent;
        }

        .download-btn:hover {
            background-color: black;
            color: #D4AF37;
            border: 2px solid #D4AF37;
            transform: translateY(-2px);
        }

        /* ווידעא סטיל */
        .video-background {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            z-index: -1;
        }

        /* לאגא אין צענטער (אופציאנאל) */
        .logo-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- דאונלאוד קנעפל סעקציע -->
    <div class="download-container">
        <!-- מאכט זיכער אז דער פייל נאמען שטימט מיט וואס דו לאדסט ארויף צו GitHub -->
        <a href="guide.pdf" download="Approved_EU_Guide" class="download-btn">
            Download PDF Details
        </a>
    </div>

    <!-- דיין ווידעא הינטערגרונט -->
    <video autoplay muted loop playsinline class="video-background">
        <source src="your-video.mp4" type="video/mp4">
        Your browser does not support HTML5 video.
    </video>

    <div class="logo-overlay">
        <!-- דא קענסטו לייגן דיין לאגא בילד -->
        <img src="logo.png" alt="Approved EU Logo" style="max-width: 300px;">
    </div>

</body>
</html>
