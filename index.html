<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>The Approved Group | EU Immigration Experts</title>
    <meta name="description" content="Secure your future in Europe with The Approved Group. Premier consultancy for EU citizenship by ancestry and residency applications.">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script>
        (function(){
            emailjs.init("Vyn1uEt_qyYpqR5Ux"); 
        })();
    </script>

    <style>
        :root { 
            --primary-blue: #050c1a; 
            --navy-shiny: #0a192f; 
            --accent-gold: #d4af37; 
            --darker-gold: #b8860b; /* טיפֿערע גאָלד פֿאַר בעסערע לייענבאַרקייט */
            --white: #ffffff; 
            --soft-bg: #fdfdfd; 
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            margin: 0; 
            background: var(--soft-bg); 
            overflow-x: hidden; 
            scroll-behavior: smooth;
        }
        
        /* HEADER SECTION */
        header { 
            background: var(--navy-shiny); 
            padding: 25px 0; 
            text-align: center; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
            border-bottom: 2px solid var(--accent-gold); 
            position: fixed; 
            width: 100%; 
            top: 0; 
            z-index: 1000; 
            transition: all 0.4s ease;
        }

        header.scrolled { 
            padding: 10px 0; 
            background: rgba(5, 12, 26, 0.95); 
            backdrop-filter: blur(10px); 
        }
        
        .logo img { 
            width: 250px; 
            transition: all 0.4s ease; 
            filter: brightness(1.1); 
        }

        header.scrolled .logo img { 
            width: 160px; 
        }
        
        .header-slogan { 
            color: var(--darker-gold); /* פֿאַרריכטעט צו דאַרק גאָלד */
            font-size: 0.85rem; 
            font-weight: 600;
            letter-spacing: 4px; 
            text-transform: uppercase; 
            margin-top: 8px;
            transition: all 0.4s ease; 
        }

        header.scrolled .header-slogan { 
            font-size: 0; 
            opacity: 0; 
            margin: 0; 
        }

        /* TOP NAVIGATION BUTTONS */
        .top-btn-container { 
            position: fixed; 
            top: 25px; 
            z-index: 1100; 
            display: flex; 
            gap: 12px; 
            transition: 0.4s; 
        }

        .left-side { left: 25px; }
        .right-side { right: 25px; }

        header.scrolled ~ .top-btn-container { 
            top: 15px; 
        }

        .luxury-btn {
            background-color: var(--accent-gold); 
            color: var(--primary-blue);
            padding: 10px 22px; 
            text-decoration: none; 
            font-weight: bold;
            font-size: 0.8rem; 
            border-radius: 50px; 
            box-shadow: 0px 4px 15px rgba(0,0,0,0.4);
            display: flex; 
            align-items: center; 
            gap: 8px; 
            border: 2px solid var(--accent-gold);
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .luxury-btn:hover {
            transform: translateY(-2px);
            background-color: var(--white);
        }

        /* VERIFICATION WIDGET */
        .verify-widget {
            background: var(--white);
            border: 1px solid var(--accent-gold);
            padding: 5px 15px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .verify-widget input {
            border: none;
            outline: none;
            font-size: 0.8rem;
            width: 170px;
            font-family: inherit;
        }

        .verified-status {
            background: var(--primary-blue);
            color: var(--accent-gold);
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 0.85rem;
            border: 1px solid var(--accent-gold);
        }

        /* HERO SECTION - FIXED HEIGHT */
        .hero { 
            position: relative; 
            height: 45vh; /* באַגרעניצט אַז עס זאָל נישט פֿאַרשטעלן דעם פֿאָרום */
            margin-top: 135px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
            background: #000; 
        }

        .hero video { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            min-width: 100%; 
            min-height: 100%; 
            transform: translate(-50%, -50%); 
            object-fit: cover; 
            z-index: 1; 
            opacity: 0.75;
        }

        /* ACTION BAR */
        .action-bar { 
            display: flex; 
            justify-content: center; 
            gap: 15px; 
            margin-top: -35px; 
            position: relative; 
            z-index: 100; 
            padding: 0 10px; 
            flex-wrap: wrap; 
        }

        .action-btn { 
            background: var(--accent-gold); 
            color: var(--primary-blue); 
            padding: 14px 28px; 
            border-radius: 50px; 
            text-decoration: none; 
            font-weight: 700; 
            font-size: 0.9rem; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
            transition: 0.3s; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            border: 2px solid var(--accent-gold); 
        }

        .action-btn:hover {
            background: var(--primary-blue);
            color: var(--accent-gold);
            transform: translateY(-3px);
        }

        /* FORM SECTION */
        .form-section { 
            padding: 100px 5% 150px; 
            background: var(--white); 
            position: relative; 
            z-index: 5; 
        }

        .form-container { 
            max-width: 750px; 
            margin: 0 auto; 
            background: var(--white); 
            padding: 50px; 
            border-radius: 20px; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.1); 
            border-top: 4px solid var(--primary-blue); 
        }

        .field { 
            margin-bottom: 25px; 
            text-align: left; 
        }

        .field label { 
            display: block; 
            font-weight: 600; 
            margin-bottom: 10px; 
            color: var(--primary-blue); 
            font-size: 0.85rem; 
            text-transform: uppercase; 
        }

        .field input, .field select, .field textarea { 
            width: 100%; 
            padding: 14px; 
            border: 1px solid #ddd; 
            border-radius: 12px; 
            box-sizing: border-box; 
            font-family: inherit; 
            transition: 0.3s; 
        }

        .field input[readonly] {
            background: #f4f7f9;
            cursor: not-allowed;
            font-weight: bold;
            color: #555;
            border-color: #cbd5e1;
        }

        .submit-btn { 
            background: var(--primary-blue); 
            color: var(--accent-gold); 
            padding: 20px; 
            border-radius: 12px; 
            width: 100%; 
            border: 2px solid var(--accent-gold); 
            font-weight: 700; 
            cursor: pointer; 
            transition: 0.3s; 
            font-size: 1.1rem; 
            text-transform: uppercase; 
        }

        .submit-btn:hover {
            background: var(--accent-gold);
            color: var(--primary-blue);
        }

        footer { 
            background: var(--primary-blue); 
            color: var(--white); 
            padding: 50px 20px; 
            text-align: center; 
        }
    </style>
</head>
<body onload="initVerification()">

<div class="top-btn-container left-side">
    <a href="guide.pdf" download class="luxury-btn"><i class="fas fa-file-download"></i> PDF GUIDE</a>
</div>

<div class="top-btn-container right-side" id="v-header-wrap">
    <div class="verify-widget" id="v-input-box">
        <input type="email" id="header_email_field" placeholder="Enter Email to Verify">
        <button class="luxury-btn" style="padding: 5px 15px; font-size: 0.7rem;" onclick="processSendCode()">Verify</button>
    </div>
    <div class="verify-widget" id="v-code-box" style="display:none;">
        <input type="text" id="header_code_field" placeholder="6-Digit Code">
        <button class="luxury-btn" style="padding: 5px 15px; font-size: 0.7rem;" onclick="processConfirmCode()">Confirm</button>
    </div>
    <div id="v-success-box" class="verified-status" style="display:none;">
        ✓ EMAIL VERIFIED
    </div>
</div>

<header id="main-header">
    <div class="logo"><img src="logo.png" alt="The Approved Group"></div>
    <div class="header-slogan">Expert EU Citizenship Consultancy</div>
</header>

<section class="hero">
    <video autoplay muted loop playsinline><source src="hero-video.mp4" type="video/mp4"></video>
</section>

<div class="action-bar">
    <a href="about.html" class="action-btn"><i class="fas fa-info-circle"></i> ABOUT</a>
    <a href="family-tree.html" class="action-btn"><i class="fas fa-tree"></i> FAMILY TREE</a>
    <a href="pay.html" class="action-btn"><i class="fas fa-credit-card"></i> PAYMENT</a>
    <a href="contact.html" class="action-btn"><i class="fas fa-address-book"></i> CONTACT</a>
</div>

<section class="form-section">
    <div class="form-container">
        <h2 style="font-family: 'Playfair Display', serif; text-align: center; color: var(--primary-blue); font-size: 2.2rem; margin-bottom: 40px;">Confidential Inquiry</h2>
        
        <form id="contact-form" action="https://formspree.io/f/xdayrong" method="POST">
            <div class="field">
                <label>Full Name</label>
                <input type="text" name="name" required placeholder="Your Legal Name">
            </div>

            <div class="field">
                <label>Email Address (Locked after verification)</label>
                <input type="email" id="locked_form_email" name="email" required readonly placeholder="Please verify email at the top right">
            </div>

            <div class="field">
                <label>Phone Number</label>
                <input type="tel" name="phone" placeholder="+1 (000) 000-0000" required>
            </div>

            <div class="field">
                <label>Primary Objective</label>
                <select name="objective" required>
                    <option value="" disabled selected>Select Inquiry Type...</option>
                    <option value="citizenship">EU Citizenship by Ancestry</option>
                    <option value="residency">EU Residency / Work Permits</option>
                    <option value="consultation">Legal Consultation</option>
                </select>
            </div>

            <div class="field">
                <label>Additional Details</label>
                <textarea name="message" rows="4" placeholder="Briefly describe your case or background..."></textarea>
            </div>

            <button type="submit" class="submit-btn" onclick="checkFinalSubmit(event)">SUBMIT INQUIRY</button>
            <p id="footer-msg" style="text-align: center; font-size: 0.8rem; color: #888; margin-top: 15px;">Verification is required to submit this form.</p>
        </form>
    </div>
</section>

<footer>&copy; 2026 THE APPROVED GROUP. ALL RIGHTS RESERVED.</footer>

<script>
    // Header Logic
    window.addEventListener('scroll', function() {
        const header = document.getElementById('main-header');
        if (window.scrollY > 50) header.classList.add('scrolled');
        else header.classList.remove('scrolled');
    });

    let internalSecretCode;

    // Load saved email if exists
    function initVerification() {
        const saved = localStorage.getItem("user_email");
        if (saved) {
            finalizeVerification(saved);
        }
    }

    function processSendCode() {
        const email = document.getElementById('header_email_field').value;
        if(!email || !email.includes('@')) { 
            alert("Please enter a valid email address."); 
            return; 
        }
        
        internalSecretCode = Math.floor(100000 + Math.random() * 900000);
        
        emailjs.send("service_tls7kck", "template_mfhx2ka", {
            to_email: email,
            code: internalSecretCode
        }).then(() => {
            alert("Verification code sent to " + email);
            document.getElementById('v-input-box').style.display = 'none';
            document.getElementById('v-code-box').style.display = 'flex';
        }, (err) => {
            alert("System error. Please try again.");
        });
    }

    function processConfirmCode() {
        const userInput = document.getElementById('header_code_field').value;
        if(userInput == internalSecretCode) {
            const finalEmail = document.getElementById('header_email_field').value;
            finalizeVerification(finalEmail);
        } else {
            alert("Invalid code. Please check your email.");
        }
    }

    function finalizeVerification(email) {
        localStorage.setItem("user_email", email);
        document.getElementById('locked_form_email').value = email;
        document.getElementById('v-input-box').style.display = 'none';
        document.getElementById('v-code-box').style.display = 'none';
        document.getElementById('v-success-box').style.display = 'block';
        document.getElementById('footer-msg').innerText = "✓ Verification successful.";
        document.getElementById('footer-msg').style.color = "green";
    }

    function checkFinalSubmit(e) {
        if (!localStorage.getItem("user_email")) {
            e.preventDefault();
            alert("Email verification is mandatory.");
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }
</script>

</body>
</html>
