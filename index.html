<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Approved EU</title>
    <style>
        /* יסודות פונעם בלאט */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: black;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* קאנטעינער פארן דאונלאוד קנעפל אויבן רעכטס */
        .download-container {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        /* סטיל פארן דאונלאוד קנעפל */
        .download-btn {
            background-color: #D4AF37; /* גאלדענע קאליר */
            color: #000;
            padding: 12px 25px;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            border-radius: 50px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.4);
            transition: all 0.3s ease;
            display: inline-block;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 2px solid transparent;
        }

        .download-btn:hover {
            background-color: #000;
            color: #D4AF37;
            border: 2px solid #D4AF37;
            transform: scale(1.05);
        }

        /* ווידעא הינטערגרונט */
        .video-background {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -1;
            object-fit: cover;
        }

        /* לאגא אין צענטער */
        .logo-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 100%;
        }

        .logo-container img {
            max-width: 350px; /* דו קענסט טוישן די סייז לויט דיין טעם */
            height: auto;
        }
    </style>
</head>
<body>

    <!-- דאונלאוד קנעפל סעקציע -->
    <div class="download-container">
        <!-- מאכט זיכער אז דער פייל נאמען אין GitHub איז "guide.pdf" -->
        <a href="guide.pdf" download="Approved_EU_Guide" class="download-btn">
            Download PDF Details
        </a>
    </div>

    <!-- ווידעא הינטערגרונט - טויש דעם נאמען צו דיין פאקטישן ווידעא פייל -->
    <video autoplay muted loop playsinline class="video-background">
        <source src="your-video.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <!-- לאגא סעקציע - טויש דעם נאמען צו דיין פאקטישן לאגא פייל -->
    <div class="logo-container">
        <img src="logo.png" alt="Approved EU Logo">
    </div>

</body>
</html>
